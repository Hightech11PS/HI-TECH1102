<!DOCTYPE html>
<html lang="ar" dir="rtl" manifest="cache.manifest">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HIGH TECH PS - مركز صيانة بلاي ستيشن</title>
  <link rel="stylesheet" href="includes/style.css">
  <style>
    body {
      text-align: center;
      font-family: Arial, sans-serif;
      background-color: #121212;
      color: #ffffff;
      padding: 15px;
    }
    .logo-container img {
      max-width: 320px;
      width: 100%;
      height: auto;
      border-radius: 15px;
      box-shadow: 0 4px 15px rgba(0, 162, 255, 0.4);
      margin: 15px 0;
    }
    .section-title {
      color: #00a2ff;
      margin-top: 25px;
      margin-bottom: 10px;
      border-bottom: 2px solid #00a2ff;
      display: inline-block;
      padding-bottom: 5px;
    }
    .firmware-select {
      width: 90%;
      max-width: 400px;
      padding: 10px;
      border-radius: 8px;
      border: 1px solid #00a2ff;
      background-color: #1e1e1e;
      color: #fff;
      font-size: 16px;
      margin-bottom: 15px;
    }
    .btn-container {
      margin: 20px 0;
    }
  </style>
</head>
<body>

  <h1>HIGH TECH PS</h1>
  <h2>مركز صيانة بلاي ستيشن</h2>
  <h3 id="UA">معلومات الجهاز:</h3>

  <!-- اللوجو المميز من Gemini -->
  <div class="logo-container">
    <img src="" alt="HIGH TECH PS Logo">
  </div>

  <hr>

  <!-- خيارات إثغارات ورروم PS4 -->
  <h3 class="section-title">إصدارات وتعديلات PS4 (من 5.05 إلى 11.02)</h3>
  <div>
    <select class="firmware-select" id="ps4-firmware">
      <option value="">اختر سوفت PS4...</option>
      <optgroup label="إصدارات التعديل (Jailbreak)">
        <option value="5.05">Firmware 5.05 (HEN / GoldHEN)</option>
        <option value="6.72">Firmware 6.72 (HEN / GoldHEN)</option>
        <option value="7.02">Firmware 7.02 (HEN / GoldHEN)</option>
        <option value="7.55">Firmware 7.55 (HEN / GoldHEN)</option>
        <option value="9.00">Firmware 9.00 (pPSSipow / GoldHEN)</option>
        <option value="11.00">Firmware 11.00 (PPPwn)</option>
      </optgroup>
      <optgroup label="باقي إصدارات النظام الرسمية">
        <option value="9.03">Firmware 9.03</option>
        <option value="9.50">Firmware 9.50</option>
        <option value="10.00">Firmware 10.00</option>
        <option value="10.01">Firmware 10.01</option>
        <option value="10.50">Firmware 10.50</option>
        <option value="11.02">Firmware 11.02</option>
      </optgroup>
    </select>
  </div>

  <!-- خيارات ثغرات وسوفتات PS5 -->
  <h3 class="section-title">تعديلات وإصدارات PS5</h3>
  <div>
    <select class="firmware-select" id="ps5-firmware">
      <option value="">اختر سوفت PS5...</option>
      <optgroup label="إصدارات تعديل PS5 (Kernel Exploits / WebKit)">
        <option value="1.xx">Firmware 1.xx (1.00 - 1.14)</option>
        <option value="2.xx">Firmware 2.xx (2.00 - 2.70)</option>
        <option value="3.xx">Firmware 3.00 - 3.21 (Webkit / Kernel Exploit)</option>
        <option value="4.03">Firmware 4.03 (ETAHEN / Mast1c0re)</option>
        <option value="4.50">Firmware 4.50 (ETAHEN)</option>
        <option value="4.51">Firmware 4.51 (ETAHEN / UMTX)</option>
        <option value="5.00-5.50">Firmware 5.00 - 5.50 (UMTX Exploit)</option>
      </optgroup>
    </select>
  </div>

  <div class="btn-container">
    <form id="kernel-options">
      <input type="radio" name="kernel" id="netctrl-exploit" value="netctrl">
      <label for="netctrl-exploit">NetCtrl</label>
      <input type="radio" name="kernel" id="lapse-exploit" value="lapse">
      <label for="lapse-exploit">Lapse</label>
    </form>
    <br>
    <button id="jeilbrek" style="padding: 10px 25px; font-size: 18px;">تشغيل التعديل</button>
    <div class="autoJb" style="margin-top: 10px;">
      <label for="autoJbInput" id="autoJbLabel">تشغيل تلقائي</label>
      <input class="mt-2" id="autoJbInput" type="checkbox">
    </div>
  </div>

  <div class="main-layout">
    <pre id="console">جاهز للبدء... awaiting execution
    </pre>
  </div>

  <script src="src/main.js"></script>
  <script src="includes/script.js"></script>
</body>
</html>
